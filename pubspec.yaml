name: vibe_connect
description: Vibe Connect — personality-based friendship matching app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  flutter_secure_storage: ^9.2.4
  hive_flutter: ^1.1.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  intl: ^0.20.2
  uuid: ^4.5.1
  logger: ^2.5.0
  crypto: ^3.0.6
  admin_core:
    path: packages/admin_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  freezed: ^2.5.8
  json_serializable: ^6.9.5
  mocktail: ^1.0.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
