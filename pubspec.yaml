name: vibe_connect
description: Vibe Connect — find friends who actually get you.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  http: ^1.2.2
  shared_preferences: ^2.3.2
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4+4
  sqlite3_flutter_libs: ^0.5.32
  path: ^1.9.0
  crypto: ^3.0.6
  image_picker: ^1.1.2
  crop_your_image: ^1.1.0
  image: ^4.3.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#5B4FE9"
  adaptive_icon_foreground: assets/branding/app_icon.png
  web:
    generate: true
    image_path: assets/branding/app_icon.png
    background_color: "#5B4FE9"
    theme_color: "#FF6F61"
  windows:
    generate: true
    image_path: assets/branding/app_icon.png
  macos:
    generate: true
    image_path: assets/branding/app_icon.png

flutter_native_splash:
  color: "#FF6F61"
  color_dark: "#201C2C"
  image: assets/branding/splash_logo.png
  android_12:
    color: "#FF6F61"
    color_dark: "#201C2C"
    image: assets/branding/splash_logo.png
    icon_background_color: "#FF6F61"
    icon_background_color_dark: "#201C2C"
  ios: true
  android: true
  web: true
